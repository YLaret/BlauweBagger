{% extends "layout.html" %}

{% block head %}
<script src="static/Chart.min.js"></script>
{% endblock %}
{% block main %}
    <div class="master-acc">
        {% for control in controls %}
        <div class="acc-item">
            <canvas id="{{control.Name}}-chart"></canvas>
            <form action="" method="post">
                <div>
                    {{ control.Name }}
                </div>
                <div>
                    <label name="{{control.Name}}-Ref">Ref [{{control.Unit}}]</label>
                    <input name="{{control.Name}}-Ref" type="number" value="{{control.Ref}}" step="0.1">
                </div>
                <div>
                    <label name="{{control.Name}}-Kp">Kp</label>
                    <input name="{{control.Name}}-Kp" type="number" value="{{control.Kp}}" step="0.1">
                </div>
                <div>
                    <label name="{{control.Name}}-Ki">Ki</label>
                    <input name="{{control.Name}}-Ki" type="number" value="{{control.Ki}}" step="0.1">
                </div>
                <div>
                    <label name="{{control.Name}}-Kd">Kd</label>
                    <input name="{{control.Name}}-Kd" type="number" value="{{control.Kd}}" step="0.1">
                </div>
                <div>
                    <input type="submit" value="Apply">
                </div>
            </form>
        </div>

        <script>
        var ctx = document.getElementById("{{control.Name}}-chart").getContext("2d");

        new Chart(ctx, {
            type: "line",
            data: {
                labels: {{ time|tojson }},
                datasets: [
                    {
                        label: "Measured [{{ control.Unit }}]",
                        data: {{ control.meas|tojson }},
                        borderColor: "#0074D9",
                        borderWidth: 3,
                        fill: false,
                        pointRadius: 0,
                        lineTension: 0,
                        yAxisID: "y-axis-value"
                    },
                    {
                        label: "Reference [{{ control.Unit }}]",
                        data: {{ control.ref|tojson }},
                        borderColor: "#FF4136",
                        borderWidth: 3,
                        fill: false,
                        pointRadius: 0,
                        lineTension: 0,
                        yAxisID: "y-axis-value"
                    },
                    {
                        label: "Frequency [Hz]",
                        data: {{ control.freq|tojson }},
                        borderColor: "#2ECC40",
                        borderWidth: 3,
                        fill: false,
                        pointRadius: 0,
                        lineTension: 0,
                        yAxisID: "y-axis-frequency"
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,

                scales: {
                    xAxes: [{
                        ticks: {
                            autoSkip: true,
                            maxTicksLimit: 10
                        },
                        scaleLabel: {
                            display: true,
                            labelString: "Time"
                        }
                    }],

                    yAxes: [
                        {
                            id: "y-axis-value",
                            position: "left",
                            scaleLabel: {
                                display: true,
                                labelString: "{{control.Unit}}"
                            }
                        },
                        {
                            id: "y-axis-frequency",
                            position: "right",
                            scaleLabel: {
                                display: true,
                                labelString: "Frequency [Hz]"
                            },
                            gridLines: {
                                drawOnChartArea: false
                            }
                        }
                    ]
                }
            }
        });
        </script>
    {% endfor %}
</div>
{% endblock %}
