{% extends "layout.html" %}

{% block head %}
<script src="{{ url_for('static', filename='Chart.min.js') }}"></script>
{% endblock %}
{% block main %}
    <div class="master-acc">
        <div>Advanced Cyclone Control</div>
        {% for control in controls %}
        <div class="acc-item">
            <canvas id="chart"></canvas>
            <form action="" method="post">
                <div>
                    {{ control.Name }}
                </div>
                <div>
                    <label name="{{control.Name}}-Ref">Ref [{{control.Unit}}]</label>
                    <input name="{{control.Name}}-Ref" type="number" value="{{control.Ref}}" step="0.1">
                </div>
                <div>
                    <label name="{{control.Name}}-Kp">Kp</label>
                    <input name="{{control.Name}}-Kp" type="number" value="{{control.Kp}}" step="0.1">
                </div>
                <div>
                    <label name="{{control.Name}}-Ki">Ki</label>
                    <input name="{{control.Name}}-Ki" type="number" value="{{control.Ki}}" step="0.1">
                </div>
                <div>
                    <label name="{{control.Name}}-Kd">Kd</label>
                    <input name="{{control.Name}}-Kd" type="number" value="{{control.Kd}}" step="0.1">
                </div>
                <div>
                    <input type="submit" value="Apply">
                </div>
            </form>
        </div>
        {% endfor %}
    </div>
<script>
    var ctx = document.getElementById("chart").getContext("2d");

    new Chart(ctx, {
        type: "line",
        data: {
            labels: {{ time|tojson }},
            datasets: [
                {
                    label: "Measured",
                    data: {{ meas|tojson }},
                    borderColor: "#0074D9",
                    borderWidth: 1,
                    fill: false,
                    pointRadius: 0,
                    lineTension: 0
                },
                {
                    label: "Reference",
                    data: {{ ref|tojson }},
                    borderColor: "#FF4136",
                    borderWidth: 1,
                    fill: false,
                    pointRadius: 0,
                    lineTension: 0
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                xAxes: [{
                    ticks: {
                        autoSkip: true,
                        maxTicksLimit: 10
                    }
                }]
            }
        }
    });
</script>
{% endblock %}
