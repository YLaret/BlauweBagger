{% extends "layout.html" %}

{% block head %}
<style>
.hmi-container 
{
	margin-left: auto;
	margin-right: auto;
	width: 800px;
	height: 600px;
    position: relative;
}
#hmi-diagram
{
    background-image: url("static/images/HMI-diagram.svg");
    background-repeat: no-repeat;
    background-size: 100%;
    background-position: center;
    width: 800px;
    height: 600px;
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 2;
}

	width: 33px;

}
